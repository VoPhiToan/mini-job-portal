<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Browse Jobs — MiniJob</title><link rel="stylesheet" href="css/style.css"></head><body data-page="jobs"><header class="site-header" id="navbar"></header><main><section class="page-header"><div class="container"><span class="eyebrow">Opportunities</span><h1>Find work that fits.</h1><p>Search and filter current openings from our growing network.</p></div></section><section class="page-content"><div class="container jobs-layout"><form id="filters-form" class="card filters"><h2>Filter jobs</h2><label><span>Keyword</span><input name="search" type="search" placeholder="Title or company"></label><label><span>Category</span><select name="category_id"><option value="">All categories</option></select></label><label><span>Location</span><select name="location"><option value="">All locations</option></select></label><label><span>Minimum salary</span><input name="salary_min" type="number" min="0" placeholder="e.g. 500"></label><label><span>Maximum salary</span><input name="salary_max" type="number" min="0" placeholder="e.g. 1500"></label><div class="filter-actions"><button class="btn btn-primary" type="submit">Apply</button><button class="btn btn-ghost" id="reset-filters" type="button">Reset</button></div></form><div><div class="results-toolbar"><p id="result-count">Loading jobs…</p><label><span class="hidden">Sort jobs</span><select id="sort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="salary_asc">Salary low → high</option><option value="salary_desc">Salary high → low</option></select></label></div><div id="jobs-list" class="jobs-list"></div><nav id="pagination" class="pagination" aria-label="Job pages"></nav></div></div></section></main><div id="toast-root" class="toast-root"></div><script type="module" src="js/common.js"></script><script type="module" src="js/jobs.js"></script></body></html>

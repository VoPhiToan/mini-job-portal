<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register — MiniJob</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head>
<body data-page="register"><header class="site-header" id="navbar"></header><main class="auth-page"><div class="auth-shell"><section class="auth-card"><span class="eyebrow">Start your journey</span><h1>Create your account</h1><p>Register as a candidate and start applying.</p><form id="register-form" class="auth-form"><label><span>Full name</span><input name="full_name" autocomplete="name" minlength="2" maxlength="100" placeholder="Nguyen Van A" required></label><label><span>Email</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label><span>Password</span><input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><small class="password-note">Use at least 8 characters.</small></label><label><span>Confirm password</span><input name="confirm_password" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password" required></label><div class="form-error" role="alert"></div><button class="btn btn-primary" type="submit">Create account</button></form><p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p></section></div></main><div id="toast-root" class="toast-root"></div><script type="module" src="js/common.js"></script><script type="module" src="js/auth.js"></script></body></html>

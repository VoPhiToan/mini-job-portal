<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login — MiniJob</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head>
<body data-page="login"><header class="site-header" id="navbar"></header><main class="auth-page"><div class="auth-shell"><section class="auth-card"><span class="eyebrow">Welcome back</span><h1>Sign in to MiniJob</h1><p>Continue your job search or manage the portal.</p><form id="login-form" class="auth-form"><label><span>Email</span><input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label><span>Password</span><input name="password" type="password" autocomplete="current-password" placeholder="Your password" required></label><div class="form-error" role="alert"></div><button class="btn btn-primary" type="submit">Sign in</button></form><p class="auth-switch">New to MiniJob? <a href="register.html">Create an account</a></p></section></div></main><div id="toast-root" class="toast-root"></div><script type="module" src="js/common.js"></script><script type="module" src="js/auth.js"></script></body></html>
